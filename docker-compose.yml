services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abyss-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount preprocessed 365-day dataset and raw directory
      - ./backend/data/processed:/app/data/processed
      - ./backend/data/raw:/app/data/raw:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/info"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: abyss-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
